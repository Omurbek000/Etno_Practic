server {
    listen 80;
    server_name _;

    # Собранный React фронтенд
    location / {
        root /home/ubuntu/Etno_Practic/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Django API
    location /ru/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /accounts/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Медиа-файлы
    location /media/ {
        alias /home/ubuntu/Etno_Practic/movie/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Статика Django
    location /static/ {
        alias /home/ubuntu/Etno_Practic/movie/staticfiles/;
        expires 30d;
    }
}
